name: Rebuild XHS 004 Songyang Manji

on:
  push:
    paths:
      - "hundred-cities/004/.rebuild-songyang-manji"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk python3-pil
      - name: Rebuild final 004 asset bundle
        run: python3 hundred-cities/004/rebuild_songyang_manji.py
      - name: Commit immutable final assets
        run: |
          git config user.name "g-shaniu-assets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hundred-cities/004/bundle.zip.b64 hundred-cities/004/manifest.json
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "assets: finalize 004 松阳漫记"
          git push
